# Demo stack: one setup job, two harmless services on 127.0.0.1, a portless
# ticker behind an option, and a known-defect entry that is always skipped.
# No containers, no network access. Commands are shell text run by bash in
# this folder. I comment every key with why it is set the way it is;
# examples/web-and-db/stack.conf does the same for a stack with a database,
# a migration and secrets. A # after a value is part of the value, so every
# comment sits on its own line.

[stack]
# The name keys the state folder, where history, run logs, backups and the
# launch table live, and would name a compose project. Two stacks on one
# machine need two names.
name = demo
# The banner, printed before anything runs, so the person at the keyboard
# knows which stack this is.
title = DEMO STACK
subtitle = hello-api . docs-site . ticker
# Only the stages this file uses, in run order: the seed job and the check
# in prepare, the services after them.
stages = prepare services
# One menu at a terminal, for the services group; --select group:services
# means the same from the command line.
menus = services
# hello-api (essential) and docs-site (recommended) start when nobody answers
# the menu: no terminal, --yes, or a blank answer. legacy-worker is optional,
# so only --select all, or its name, reaches it.
default_select = recommended
# Both services are built on nc, so a machine without it stops at preflight
# with the command named, before anything starts.
require = nc
# The one end-to-end proof: after the last stage, hello-api's health page
# must answer 200 within 20 seconds, its body must not contain <% (the sign
# of a page served unrendered), and the check runs only when hello-api
# started at all.
smoke_url = http://127.0.0.1:18081/health
smoke_expect = 200
smoke_forbid = <%
smoke_requires = hello-api
smoke_timeout = 20

# The five built-in owner ids already carry these labels; these sections
# show where a label is changed. An advice line under a label is printed
# under every fault that names the owner.
[owner this-machine]
label = THIS MACHINE

[owner local-config]
label = LOCAL CONFIGURATION

[owner upstream]
label = UPSTREAM CODE

# Signatures are tried in file order against the output of an entry whose
# command failed; the first match names the owner and prints explain. This
# is the line a server prints when its port is taken.
[signature port-in-use]
match = [Aa]ddress already in use
owner = this-machine
explain = another program already listens on this port; stop it, or run stack-up --stop first

# bash prints this for a program that is not installed, which is a fact
# about this machine, not about the code.
[signature missing-command]
match = command not found
owner = this-machine
explain = a command this entry runs is not installed on this machine

[option ticker]
# One yes/no question per run at a terminal, or --with ticker, --without
# ticker, or the default under --yes. The ticker service runs only while it
# is on.
question = Also start the ticker, which writes one log line every 5 seconds?
default = no
# When the answer is no, a ticker left running by an earlier run is stopped;
# leave, the default, would leave it as it was.
when_off = stop

[job settings-seed]
description = Writes the demo settings file on first run, with one key deliberately missing
# Before the services, so hello-api finds its settings file.
stage = prepare
# exit 1 skips the job with a "not needed" line, so a rerun never rewrites
# the file. $STACK_STATE is exported to every command.
run_if = test ! -f "$STACK_STATE/demo-settings.env"
# The file lands in the state folder, never in this checkout, and GREETING is
# left out on purpose, so the check below has something to repair on the
# first run.
run = mkdir -p "$STACK_STATE" && printf 'COLOR=green\n' >> "$STACK_STATE/demo-settings.env"
# A job past its deadline is stopped with its process group; this one takes a
# fraction of a second.
timeout = 10

[check greeting]
# Verified at the end of prepare: probe, then backup, repair and probe again,
# with every repair written to repair.log in the state folder.
stage = prepare
# required, and only hello-api needs it: hello-api is not started while the
# check is unmet, and the check does not run when hello-api is not selected.
level = required
dependent = hello-api
# exit 0 means the setting holds; anything else is unmet and starts the
# repair.
probe = grep -q '^GREETING=' "$STACK_STATE/demo-settings.env"
# Copied into the backups folder before the repair runs. A path value writes
# ${STACK_STATE}, a command value $STACK_STATE: stack-up resolves paths and
# bash expands commands.
target = ${STACK_STATE}/demo-settings.env
# add-greeting.sh writes a new copy and moves it into place, so a failure
# leaves the file as it was; then the probe runs again.
repair = bash add-greeting.sh "$STACK_STATE/demo-settings.env"
# Says what an unmet check costs, so whoever reads the failure knows whether
# it matters to them.
consequence = hello-api would answer with an empty greeting

[service hello-api]
description = Plain-text HTTP responder written in bash and nc
# essential, so every selection includes it; groups puts it in the services
# menu.
tier = essential
groups = services
stage = services
# Ordered after the seed job, and selecting hello-api selects the job too.
depends_on = settings-seed
# Exported to the process as PORT, which serve.sh reads; checked to be free
# before anything starts; and the listener must belong to the launched group
# before the service counts as ready.
port = 18081
# Read literally, never sourced: the repaired GREETING reaches only this
# process, and the plan names the file, never its content.
env_file = ${STACK_STATE}/demo-settings.env
# exec replaces the wrapper shell with the server script, so the launched
# group holds only the server and its workers.
start = exec bash hello-api.sh
# http: the health page must answer 200 from a listener in the launched
# group.
ready = http http://127.0.0.1:18081/health 200
# nc answers within a second; the default of 60 would only hide a broken
# start behind a long wait.
ready_timeout = 10
# Shown in the menu and the summary; written in full because no placeholder
# is replaced in a URL.
url = http://127.0.0.1:18081/

[service docs-site]
description = One static page served by bash and nc
# recommended: started by default, left out by --select essential.
tier = recommended
groups = services
stage = services
port = 18082
# A precheck runs just before the start and fails the entry with the hint
# when it fails, so a missing page is named instead of a server that answers
# with an empty body.
precheck = test -r www/index.html
precheck_hint = the demo page www/index.html is missing; restore it from the repository
start = exec bash docs-site.sh
# The default when port is set: a process in the launched group listens on
# it. Written out so the choice is visible.
ready = port
ready_timeout = 15
url = http://127.0.0.1:18082/

[service ticker]
description = Writes one line every 5 seconds and has no port
tier = essential
groups = services
stage = services
# Runs only while the ticker option is on.
option = ticker
start = while :; do date '+%H:%M:%S tick'; sleep 5; done
# Nothing to probe, so ready means still running after 3 seconds; the number
# must be shorter than ready_timeout, 60 by default.
ready = alive 3

[service legacy-worker]
description = Stands in for an upstream service that cannot start
# optional, so only --select all, or its name, selects it.
tier = optional
groups = services
stage = services
# Never started and never counted as a failure: the summary lists it under
# the defect_owner (upstream by default) with this text. known_defect_check
# runs a command instead, for a defect that comes and goes.
known_defect = demo entry: shows how a known upstream defect is skipped with no dead wait
# start is required by the schema; it never runs.
start = false
