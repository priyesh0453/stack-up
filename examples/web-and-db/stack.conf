# A local stack of the shape most web projects have: a database in a
# container, a migration that runs when the schema changed, an API and a web
# front end started from this machine's node, and one local file for the
# secrets. I comment every key for someone reading a stack.conf for the first
# time: why it is here, and what else you could write. The engine validates
# this file (tests/unit-examples.sh runs --print-config and --plan on it); I
# have not run it end to end, because the api/ and web/ folders it names are
# yours. Copy this folder next to your project, copy .env.example to .env,
# then run bin/stack-up --config stack.conf --plan until the plan reads
# right. Values are literal: quotes stay part of a value, and a # after a
# value is part of the value too, so every comment sits on its own line.

[stack]
# The name keys everything this stack owns: the state folder, where history,
# run logs, backups and the launch table live (under ~/.local/state/stack-up
# unless state_dir says otherwise), and the compose project, so the container
# is listed as web-and-db-db-1. Two stacks on one machine need two names.
name = web-and-db
# The banner is the first thing a run prints. I list the pieces in the
# subtitle so anyone at the keyboard knows what is about to start.
title = WEB AND DB
subtitle = db (compose) . migrate . api . web
# Stages run in this order and every entry names one. The default list has
# eight; I keep the four this file uses, and migrate is its own stage so the
# plan shows it between the database and the services.
stages = prepare infra migrate services
# One menu at a terminal, for the entries in the apps group. Without menus,
# every pickable entry (services, by default) is offered in one menu anyway;
# naming the group also makes --select group:apps mean the same thing.
menus = apps
# What starts when nobody answers the menu: no terminal, --yes, or a blank
# answer. Tiers add up, so recommended means essential plus recommended, and
# api (essential) and web (recommended) both start. On a machine that only
# needs the API, --select essential leaves web out.
default_select = recommended
# A command every run needs, checked before anything starts; the key repeats,
# one command per line. requires inside an entry does the same for that entry
# alone, which is the better place when only one entry needs the tool.
require = node
require = npm
# --clean keeps this many run logs besides its own. The default, 0, keeps
# every run log, which is fine until you have started the stack every morning
# for a year.
keep_runs = 20
# The compose file beside this config, passed with -f on every compose call.
# Compose runs in this folder, so this is also where it finds .env for the
# ${...} values written in compose.yaml. A second file goes after a space.
# The engine is probed with docker info (engine_check) before a compose entry
# starts; when it is not running, the run stops and says so, because
# engine_start is empty. Set engine_start to the command that opens your
# engine's desktop app to have the run start it, engine_timeout to how long
# that takes, and compose_command to another front end, such as podman
# compose; its first word is what --plan lists under requires.
compose_files = compose.yaml
# The one end-to-end proof. After the last stage the api's health page must
# answer 200 within 60 seconds, and only when the api started at all
# (smoke_requires): a run where api was not selected skips the check.
# smoke_forbid is a pattern the body must not contain, for a health page that
# answers 200 while reporting that the database is down.
smoke_url = http://127.0.0.1:8080/health
smoke_expect = 200
smoke_forbid = "db":"(down|error)"
smoke_requires = api
smoke_timeout = 60
# The closing line names the web page, because that is where you go next.
# The smoke check fetched the api, not this page, so the line reads Open (not
# checked) with this address; without open_url it reads Open with the
# smoke_url, which the check did prove.
open_url = http://127.0.0.1:3000/
# Signatures are tried against the output of a failed entry, and the first to
# match names the owner. Lines matching this pattern are removed first, so an
# npm notice that quotes an error text cannot pick an owner before the real
# error line does. The key repeats, one pattern per line.
classify_ignore = ^npm (WARN|warn|notice)

[owner local-config]
# Owner ids say who should act on a failure. Five are built in with labels of
# their own: this-machine, local-config, local-data, upstream and
# needs-a-look. An [owner] section relabels one of them or adds a new id, and
# its advice is printed under every fault that names the owner. I keep the
# built-in label and add the advice, because in this stack every
# local-config fault is fixed in one of two files.
label = LOCAL CONFIGURATION
advice = the fix is in .env or web/.env.local in this folder; nobody else needs to be asked

[signature port-in-use]
# A signature turns a known log line into an owner and one plain sentence.
# They are tried in file order against the output of an entry whose command
# failed, and the first match wins, so the specific ones go first. node
# prints EADDRINUSE; the second form is what most other runtimes print.
match = EADDRINUSE|[Aa]ddress already in use
owner = this-machine
explain = another program already listens on this port; find it with lsof -i :PORT, then stop it yourself or change the port here

[signature db-refused]
# The api and the migration both connect to the database port; a refused
# connection means the container is not up, not that the code is wrong.
# applies_to limits a signature to the kinds it fits, so a refused
# connection in a compose call's output is never read as this one.
match = ECONNREFUSED
owner = this-machine
explain = nothing accepts connections on the database port; run the stack again so [compose db] brings the container up, or read its log with docker compose -p web-and-db logs db
applies_to = service job

[signature bad-credentials]
# The database prints this when DB_USER or DB_PASSWORD in .env is not what
# the container was created with. local-config owns it, so the advice line
# from the [owner] section above is printed under the fault.
match = Access denied for user
owner = local-config
explain = DB_USER or DB_PASSWORD in .env does not match the database; fix .env, or, if you changed them after the first start, the data volume still holds the old ones
applies_to = service job

[signature schema-drift]
# Both patterns must match, anywhere in the output, before this one applies:
# a migration failed because a table it creates already exists. That is a
# data problem on this machine, a volume from another branch, so local-data
# owns it and the explanation says where the data lives.
match = already exists
also = [Mm]igrat
owner = local-data
explain = the database already has a table a migration creates, so its data is from another branch or an older schema; use a fresh DB_NAME in .env, or remove the project's volume by hand with the commands --print-paths prints
applies_to = job

[option seed]
# An option is one yes/no question, asked once per run at a terminal, or
# answered by --with seed, --without seed, or its default under --yes. The
# seed job below runs only while it is on. when_off = leave, the default, is
# right for a job; stop would also stop the option's services whenever the
# option is off, which the demo's ticker uses.
question = Also load the sample data set into the database (a minute or so)?
default = no

[env secrets]
# An env provider is a command that prints KEY=VALUE lines. The values stay
# in stack-up's memory and reach only the entries that name this provider in
# env_from, inside their own child process: never stack-up's environment,
# never a command line, and the run log shows KEY=<set>. The script reads
# .env beside this file, skips comments and blank lines, and fails with a
# hint when the file is missing. Swap the command for your secret manager's
# CLI later and nothing else in this file changes.
run = bash read-secrets.sh .env
# needs fails the entry before its command runs when the path is missing, and
# needs_hint is the advice printed with it, so a fresh clone gets the fix
# named under THIS MACHINE instead of the script's exit status under NEEDS A
# LOOK.
needs = .env
needs_hint = copy .env.example to .env in this folder and fill in the values
# prepare is the default stage for a provider. I write the stage on every
# entry so this file and the plan agree at a glance.
stage = prepare

[compose db]
# The database comes from compose.yaml, started with up -d for the services
# named here under the project name, and stopped by --stop with stop, never
# down, so the data volume survives. A compose entry takes no env, env_file
# or env_from: compose reads .env itself for the ${...} values in
# compose.yaml.
services = db
# healthy waits for the health check written in compose.yaml; running would
# only wait for the container's process, and the migration would race a
# database that is still initialising. I allow two minutes because a first
# start also creates the data folder; the default is three.
ready = healthy
ready_timeout = 120
# infra is the default stage for a compose entry.
stage = infra

[job migrate]
# A job runs once per run under a deadline, in its own process group. This
# one applies the pending migrations in api/migrations to the database.
description = Applies the pending database migrations from api/migrations
stage = migrate
# depends_on orders this job after the database and pulls db in whenever the
# job is selected, so --select api brings up the whole chain.
depends_on = db
# The migration needs the database credentials: env_from names the provider,
# and the values are set only in this job's child process.
env_from = secrets
# Commands run in dir, so migrate.js and migrations are named relative to
# api/. The default is the folder of this file.
dir = api
# run_if decides whether the job is needed: exit 0 runs it, 1 skips it with a
# "not needed" line, anything else is an error. Mine runs when no marker
# exists yet or the migrations folder is newer than the marker, so adding a
# migration file makes the next run apply it and a plain rerun skips it.
# $STACK_STATE is exported to every command, and the marker lives in the
# state folder, never in the checkout.
run_if = test ! -f "$STACK_STATE/migrated" || test migrations -nt "$STACK_STATE/migrated"
run = node migrate.js && touch "$STACK_STATE/migrated"
# A migration stuck on a lock is stopped with its process group at the
# deadline instead of hanging the run. The default is ten minutes.
timeout = 300
# When the job fails, up to five distinct lines matching fail_detail are
# printed under the failure, so the reason is on screen without opening the
# log. ok_marker and fail_marker judge the output as well, trust_exit = no
# ignores the exit status, for a tool that exits 0 on failure, and report
# runs one more command after a pass and prints its first line as an INFO
# line.
fail_detail = ^(Error|error|ERROR)

[job seed]
# Runs only while the seed option is on, after the migration, with the same
# credentials, and once: the marker skips it on later runs, so answering yes
# twice does not load the rows twice. always = yes is needed because nothing
# depends on this job, and a job runs only when something selected needs it
# or always says so; the option still gates it.
description = Loads the sample data set once (option seed)
stage = migrate
option = seed
always = yes
depends_on = migrate
env_from = secrets
dir = api
run_if = test ! -f "$STACK_STATE/seeded"
run = node seed.js && touch "$STACK_STATE/seeded"
timeout = 300

[check web-api-url]
# A check is a setting that must hold, verified at the end of its stage:
# probe, then backup, repair and probe again, with every repair written to
# repair.log in the state folder. This one is the setting people forget on a
# fresh clone: the web app must be told where the api is.
stage = prepare
# required means the dependent is not started while the check is unmet;
# advisory would only print a line and count it in the closing line.
level = required
# Only web needs this file, so the check runs only when web is selected;
# --select essential (api alone) never touches web/.env.local.
dependent = web
# The probe runs in this folder with a 60 second deadline; exit 0 means the
# setting holds.
probe = grep -q '^API_URL=http://127.0.0.1:8080$' web/.env.local
# target is copied into the backups folder before the repair runs (a repair
# with neither target nor a backup command is a validation error). When the
# file does not exist yet there is nothing to copy, and repair.log says so.
target = web/.env.local
# The repair writes a new copy of the file with the key set and moves it into
# place, so a failure leaves the original as it was; then the probe runs
# again. With repair = ask in [stack] the run asks first, and --no-repair
# only reports.
repair = bash set-dotenv.sh web/.env.local API_URL http://127.0.0.1:8080
consequence = the web app would call the wrong address for the api, and every page would show a network error

[service api]
# A service is a long-running process, launched in its own process group with
# a launch token, so --stop can prove a group is still this stack's before it
# signals anything.
description = The HTTP API on 8080, from api/ with this machine's node
# essential is the lowest tier, so essential, recommended and all include
# it; groups puts it in the apps menu.
tier = essential
groups = apps
stage = services
# After the migration, which pulls in db and secrets as well.
depends_on = migrate
dir = api
env_from = secrets
# env sets a literal value for this entry alone. NODE_ENV is not a secret and
# belongs to this entry, so it lives here and not in .env; the key repeats,
# one KEY=VALUE per line. env_file reads a whole KEY=VALUE file the same way,
# literally, never sourced.
env = NODE_ENV=development
# The port is exported to the process as PORT and checked before anything
# starts: a copy this stack launched earlier is stopped and started again,
# and anything else holding it stops the run with its PID named. The
# readiness probe then insists the listener belongs to the launched group.
port = 8080
# exec replaces the wrapper shell with node, so the group holds one process
# and TERM reaches the server directly.
start = exec node server.js
# http: ready when the URL answers 200 and the listener is in the launched
# group. ${PORT} is replaced with the port above, so the number is written
# once. port alone accepts any listener from the group, cmd runs a command of
# yours, and alive N is for a worker without a port.
ready = http http://127.0.0.1:${PORT}/health 200
# A dev server that takes longer than this to answer its health page is
# broken, and I want the run to say so sooner than the default 60 seconds.
ready_timeout = 30
# Shown in the menu and the summary, as written: no placeholder is replaced
# in a URL, so the port appears once more here.
url = http://127.0.0.1:8080/

[service web]
description = The web front end on 3000, a dev server from web/
# recommended: started by default, left out by --select essential.
tier = recommended
groups = apps
stage = services
# The page calls the api, so web starts after it; selecting web alone still
# pulls api in.
depends_on = api
dir = web
port = 3000
# The dev server takes its port on the command line, and PORT is exported to
# the command, so the number above is the only copy. exec, as for the api.
start = exec npm run dev -- --port "$PORT"
# port: ready as soon as a process in the launched group listens on 3000. It
# is the default when port is set; I write it so the choice is visible.
ready = port
# Bundling a front end for the first time can take a while; the default is
# 60 seconds.
ready_timeout = 90
url = http://127.0.0.1:3000/
# warn: when web fails, the run ends Degraded (exit 3) instead of Partial
# (exit 1), because the api is usable without it. count is the default for a
# service, and abort stops the run.
on_fail = warn

[heal api-modules]
# A heal is one attempt per service per run to fix a failure the log
# identifies; when it exits 0, the service is started once more. This is the
# classic one: dependencies not installed since the last pull. The command
# runs in this folder, not in the service's dir, so the cd is written out;
# when_log is tried against the failed service's output, and when runs a
# probe command instead.
for = api
when_log = Cannot find (module|package)|ERR_MODULE_NOT_FOUND
run = cd api && npm ci
# npm ci can take minutes; the default deadline is 60 seconds. settle would
# add a pause between the heal and the restart, for a fix that takes effect
# a moment later.
timeout = 600

[heal web-modules]
# The same fix for the web app. One heal per service, because the command has
# to know which folder to install in; for takes a list when one command fits
# several services.
for = web
when_log = Cannot find (module|package)|ERR_MODULE_NOT_FOUND
run = cd web && npm ci
timeout = 600
