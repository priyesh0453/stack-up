# Classifier fixture: signature order is match order.
[stack]
name = classify
classify_ignore = ^optional probe failed

[owner upstream]
label = UPSTREAM CODE
advice = open an issue with the service's owners

[owner build-tools]
label = BUILD TOOLS

[service api]
start = sleep 60

[signature port-in-use]
match = [Aa]ddress already in use
owner = this-machine
explain = another program already listens on this port

[signature missing-setting]
match = missing key [A-Z_]+
also = connection refused
owner = local-config
explain = a setting is missing and a dependency refused the connection

[signature refused]
match = connection refused
owner = upstream
explain = a dependency is not accepting connections

[signature disk]
match = out of disk space
owner = this-machine
explain = the disk is full

[signature panic]
match = ^panic:
owner = upstream
explain = the service crashed

[signature module]
match = cannot find module
owner = build-tools
explain = the build could not resolve a module
applies_to = job
